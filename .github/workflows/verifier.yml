
name: Vérifier le bot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verification:
    name: Vérification JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier tous les fichiers JavaScript
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Vérification : $file"
            node --check "$file"
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -name '*.js' -type f -print0)

          echo "Tous les fichiers JavaScript ont une syntaxe valide."
